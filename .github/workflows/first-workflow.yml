name: .NET CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ActionsLearning.sln

      - name: Build
        run: dotnet build ActionsLearning.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ActionsLearning.sln --configuration Release --no-build

