name: .NET CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: ${{ vars.BUILD_CONFIGURATION }}

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ActionsLearning.sln

      - name: Build
        run: dotnet build ActionsLearning.sln --configuration "$BUILD_CONFIGURATION" --no-restore

      - name: Test
        run: >
          dotnet test ActionsLearning.sln 
          --configuration "$BUILD_CONFIGURATION" 
          --no-build 
          --logger "trx;LogFileName=test-results.trx" 
          --results-directory ./TestResults

      - name: Check test results files
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          find . -maxdepth 4 -type f -print

      - name: Upload Test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults

      - name: Publish
        run: dotnet publish ActionsLearning.Tests/ActionsLearning.Tests.csproj --configuration "$BUILD_CONFIGURATION" --no-build --output ./publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-build
          path: ./publish

      - name: Inspect configuration
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Build configuration: $BUILD_CONFIGURATION"

      - name: Verify secret
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          if [ -z "$DEMO_TOKEN" ]; then
            echo "DEMO_TOKEN is missing"
            exit 1
          fi

          echo "DEMO_TOKEN is available"

  inspect-results:
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Prove this is a different job
        run: |
          if [ -d "./TestResults" ]; then
            echo "Unexpected: TestResults already exists"
            exit 1
          else
            echo "Correct: this job does not have files from build-test"
          fi

      - name: Download test results
        uses: actions/download-artifact@v5
        with:
          name: test-results
          path: ./DownloadedResults

      - name: Inspect downloaded files
        run: find ./DownloadedResults -type f -print

  security-check:
    needs: build-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Verify GITHUB_TOKEN read access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking repository access..."
          gh api repos/${{ github.repository }} --jq '.full_name'

      - name: Verify OIDC permission
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC request URL is unavailable"
            exit 1
          fi

          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "OIDC request token is unavailable"
            exit 1
          fi

          echo "OIDC token request capability is available"
          echo "OIDC token itself will not be printed"