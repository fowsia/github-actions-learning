name: .NET CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ActionsLearning.sln

      - name: Build
        run: dotnet build ActionsLearning.sln --configuration Release --no-restore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with: 
          name: build-output
          path: ActionsLearning.Tests/bin/Release/

      

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ActionsLearning.Tests/bin/Release/

      - name: Test
        run: dotnet test ActionsLearning.sln --configuration Release --no-build

  deploy:
    needs: test
    if: ${{ success() }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy
        run: echo "Deploying application..."